<div class="parent" [style.background-color]="loginBackgroundColor" [style.background-image]="loginGradient" [style.--placeholder-color]="loginInputPlaceholderColor">
  <div class="form-structor" [style.background-image]="'url(' + loginBackgroundImage + ')'">
    <div class="signup">
      <div class="form-holder">
        <input type="text" [(ngModel)]="loginObj.user" name="user" class="input" placeholder="User" required />
        <input type="password" class="input" [(ngModel)]="loginObj.password" name="password" placeholder="Password"
          required />
      </div>
      <button type="buttom" class="submit-btn" (click)="doLogin()" [ngStyle]="{'background-color': loginButtonColor}" [class.btn-hover-hcmaia]="clubConfigService.getCurrentClubConfig().tenantId === 1" [class.btn-hover-advalongo]="clubConfigService.getCurrentClubConfig().tenantId === 2" [class.btn-hover-cis]="clubConfigService.getCurrentClubConfig().tenantId === 3">Log in</button>
      <div class="d-flex justify-content-center">
        <div class="spinner-border text-danger" *ngIf="spinner" styrole="status">
          <span class="sr-only"></span>
        </div>
      </div>
      <P> </P>
      <div *ngIf="erroLogin" class="erroLogin">Login inválido</div>
      <div *ngIf="srvIndisponivel" class="erroLogin">Site indisponivel</div>
      <div *ngIf="showSessionExpiredMessage" class="erroLogin">Sessão expirada. Faça novo login</div>
    </div>


  </div>
</div>
